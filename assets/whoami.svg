<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 16px; fill: #c9d1d9; white-space: pre; }
      .p { fill: #2dd4bf; font-weight: 700; }
      .k { fill: #7d8590; }
      .v { fill: #e6edf3; }
      .a { fill: #fbbf24; }
      .t { fill: #7d8590; font-size: 13px; }
      .l { opacity: 0; animation: in 0.4s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="429" rx="14" fill="#0d1117" stroke="#2dd4bf" stroke-opacity="0.3"/>
  <rect x="0.5" y="0.5" width="959" height="38" rx="14" fill="#161b22"/>
  <rect x="0.5" y="24" width="959" height="15" fill="#161b22"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="20" r="6" fill="#27c93f"/>
  <text class="t" x="480" y="25" text-anchor="middle">sebastian@bogota: ~</text>

  <g transform="translate(32 76)">
    <text class="l" style="animation-delay:.2s" y="0"><tspan class="p">$</tspan> whoami</text>
    <text class="l" style="animation-delay:.6s" y="28"><tspan class="v">Sebastian Castellanos</tspan></text>

    <text class="l" style="animation-delay:1.1s" y="68"><tspan class="p">$</tspan> cat perfil.txt</text>
    <text class="l" style="animation-delay:1.4s" y="96"><tspan class="k">rol      :</tspan> <tspan class="v">desarrollador · seguridad de aplicaciones</tspan></text>
    <text class="l" style="animation-delay:1.6s" y="122"><tspan class="k">base     :</tspan> <tspan class="v">Bogotá, Colombia</tspan></text>
    <text class="l" style="animation-delay:1.8s" y="148"><tspan class="k">construyo:</tspan> <tspan class="v">apps Android, herramientas en Go y agentes de IA</tspan></text>
    <text class="l" style="animation-delay:2.0s" y="174"><tspan class="k">ahora    :</tspan> <tspan class="v">revisores automáticos de código y seguridad</tspan></text>

    <text class="l" style="animation-delay:2.5s" y="214"><tspan class="p">$</tspan> cat principios.txt</text>
    <text class="l" style="animation-delay:2.8s" y="242"><tspan class="a">›</tspan> toda entrada es no confiable, hasta un QR o un pull request</text>
    <text class="l" style="animation-delay:3.0s" y="268"><tspan class="a">›</tspan> si no hay una prueba que lo ataque, no está protegido</text>
    <text class="l" style="animation-delay:3.2s" y="294"><tspan class="a">›</tspan> decir lo que no protege también es parte del diseño</text>

    <text class="l" style="animation-delay:3.7s" y="334"><tspan class="p">$</tspan> <tspan class="cursor">█</tspan></text>
  </g>
</svg>
